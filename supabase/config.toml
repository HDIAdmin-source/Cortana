# Local Supabase settings used by `pnpm db:start` / `pnpm db:reset`.
# Only what Cortana needs is listed; the Supabase CLI fills in defaults for the rest.

project_id = "cortana"

[api]
port = 54321

[db]
port = 54322
# Keep this equal to the Postgres version of the hosted project
# (Supabase dashboard > Project Settings > Infrastructure).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

# "Log in with Discord" is switched on in Phase 4.
# [auth.external.discord]
# enabled = true
# client_id = "env(DISCORD_CLIENT_ID)"
# secret = "env(DISCORD_CLIENT_SECRET)"
